name: Release Workflow

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest

      - name: Extract Semantic Version and Commit SHA
        id: meta
        run: |
          # Automatically strip 'v' prefix from tag (e.g., v1.0.0 -> 1.0.0) without hardcoding
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/student-ml-api:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/student-ml-api:latest
            ghcr.io/${{ github.repository_owner }}/student-ml-api:${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=student-ml-api
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}